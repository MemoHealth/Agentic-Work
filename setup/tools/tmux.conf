# tmux config - starter, copy to ~/.tmux.conf

# Enable mouse: click to select panes/windows, scroll, resize
set -g mouse on

# Start windows and panes at 1, not 0 (easier to reach on the keyboard)
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Open new windows and splits in the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# More colors, better app compatibility
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Bigger scrollback history
set -g history-limit 10000

# Reload this config with: Ctrl+b r
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# Faster key response (no delay after Esc, helps Neovim)
set -sg escape-time 10

# Status bar: clean and dark
set -g status-style "bg=default fg=white"
set -g status-left "#[fg=green]#S "
set -g status-right "#[fg=cyan]%Y-%m-%d %H:%M "
set -g status-right-length 40
